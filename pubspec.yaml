name: hakawy
description: "اسمارت حكاوي - اتكلم إنجليزي مع شخصية بالذكاء الاصطناعي"
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  http: ^1.2.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  image_picker: ^1.1.2
  google_mlkit_face_detection: ^0.13.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/3d/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1B1340"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 24
