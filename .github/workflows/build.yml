name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter --version
          flutter create --org com.smart --project-name hakawy --platforms android .
          rm -rf test
          python3 tool/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk smart-hakawy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: smart-hakawy-apk
          path: smart-hakawy.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: اسمارت حكاوي - نسخة ${{ github.run_number }}
          body: نزّل ملف smart-hakawy.apk وثبّته على الموبايل.
          files: smart-hakawy.apk
          make_latest: true
